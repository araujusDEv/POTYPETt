# PotyPet — Render Free + banco Turso Free + e-mail Google por HTTPS.
# Guia: docs/guias/RENDER-GRATUITO.md. Nenhum disco ou serviço pago é criado.
services:
  - type: web
    name: potypet
    runtime: node
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_DRIVER
        value: turso
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_TRANSPORT
        value: gmail_http
      - key: MAIL_FROM
        sync: false
      - key: MAIL_QUEUE_KEY
        sync: false
      - key: MAIL_HTTP_URL
        sync: false
      - key: MAIL_HTTP_SECRET
        sync: false
      - key: SEED_DEMO_ACCOUNTS
        value: "0"
      - key: SEED_SAMPLE_DATA
        value: "0"
      - key: BACKUP_AUTO
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "0"
      - key: DONOR_NAME
        value: Associação Poty Amigos dos Bichos
      - key: CADASTRO_INICIAL
        value: "1"
      - key: USUARIO_SENHA
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DONOR_EMAIL
        value: hypestoreoofc@gmai.com
      - key: DONOR_PASSWORD
        sync: false
